[project]
name = "relay-backend"
version = "0.1.0"
description = "Relay backend: voice-first team chatroom with AI summaries and request tracking"
authors = [
    { name = "Enoch Chang", email = "eeknoc@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "certifi>=2026.10.23",
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "livekit-api>=1.2.2",
    "openai>=3.50.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[tool.uv]
package = false  # an app, not a library: run with `uv run uvicorn src.main:app`

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
