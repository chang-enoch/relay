[project]
name = "relay-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Enoch Chang", email = "eeknoc@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.10.23",
    "fastapi>=0.162.2",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "livekit-api>=1.2.2",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
relay-backend = "relay_backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]
